<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>올라타자 지문 찾기</title>
<meta name="description" content="큐플레이 올라타자 지문 검색. 지문 일부만 입력하면 전체 문장이 나오고 자동으로 복사돼요.">
<link rel="preconnect" href="https://cdn.jsdelivr.net">
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard@v1.3.9/dist/web/static/pretendard.css">
<style>
  :root{ --ink:#0E1020; --surface:#181B34; --surface-2:#20244a; --line:#2c3160;
    --text:#EDEEF7; --muted:#8A90BC; --buzz:#C6F135; --hot:#FF4D97; --radius:14px; }
  *{box-sizing:border-box;margin:0;padding:0}
  html{-webkit-text-size-adjust:100%}
  body{font-family:"Pretendard Variable",Pretendard,system-ui,sans-serif;
    background:radial-gradient(900px 500px at 15% -10%,#1b2050,transparent 60%),
      radial-gradient(700px 500px at 110% 10%,#2a1440,transparent 55%),var(--ink);
    color:var(--text);min-height:100vh;padding:20px 16px 60px;line-height:1.5;}
  .wrap{max-width:720px;margin:0 auto}
  header{display:flex;align-items:center;gap:12px;margin:8px 2px 18px}
  .dot{width:22px;height:22px;border-radius:50%;background:var(--buzz);
    box-shadow:0 0 0 4px rgba(198,241,53,.18),0 0 22px rgba(198,241,53,.55);flex:0 0 auto;
    animation:pulse 2.4s ease-in-out infinite}
  @keyframes pulse{50%{box-shadow:0 0 0 8px rgba(198,241,53,.08),0 0 26px rgba(198,241,53,.7)}}
  h1{font-size:20px;font-weight:800;letter-spacing:-.02em}
  h1 span{color:var(--muted);font-weight:600;font-size:13px;display:block;letter-spacing:0}
  .notice{display:flex;align-items:center;gap:9px;background:rgba(198,241,53,.10);
    border:1px solid rgba(198,241,53,.35);border-radius:12px;padding:11px 13px;margin-bottom:14px;
    font-size:13.5px;line-height:1.5;color:var(--text)}
  .notice svg{width:18px;height:18px;flex:0 0 auto;color:var(--buzz)}
  .notice b{color:var(--buzz);font-weight:800}
  .search{position:relative;margin-bottom:12px}
  .search input{width:100%;padding:16px 46px 16px 18px;font-size:16px;background:var(--surface);
    border:1.5px solid var(--line);border-radius:var(--radius);color:var(--text);outline:none;
    transition:border-color .15s, box-shadow .15s}
  .search input:focus{border-color:var(--buzz);box-shadow:0 0 0 4px rgba(198,241,53,.14)}
  .search input::placeholder{color:var(--muted)}
  .clear{position:absolute;right:8px;top:50%;transform:translateY(-50%);border:0;background:var(--surface-2);
    color:var(--muted);width:30px;height:30px;border-radius:8px;cursor:pointer;font-size:16px}
  .clear:hover{color:var(--text)}
  .meta{font-size:13px;color:var(--muted);margin:14px 2px 10px}
  .meta b{color:var(--buzz)}
  .autonote{color:var(--buzz);font-weight:700}
  .list{display:flex;flex-direction:column;gap:7px}
  .card{background:var(--surface);border:1px solid var(--line);border-radius:var(--radius);
    padding:14px 15px;cursor:pointer;font-size:15.5px;color:var(--text);line-height:1.55;
    transition:border-color .1s;animation:rise .2s ease both}
  @keyframes rise{from{opacity:0;transform:translateY(6px)}}
  .card:hover{border-color:var(--buzz)}
  .card.top{border-color:var(--buzz);box-shadow:0 0 0 1px var(--buzz)}
  .card .cp{float:right;margin-left:10px;width:15px;height:15px;color:var(--muted)}
  .card:hover .cp{color:var(--buzz)}
  mark{background:rgba(255,77,151,.25);color:var(--text);border-radius:3px;padding:0 2px}
  .empty{text-align:center;color:var(--muted);padding:48px 16px;font-size:14px}
  .empty b{color:var(--text);display:block;margin-bottom:6px;font-size:15px}
  .toast{position:fixed;left:50%;bottom:24px;transform:translateX(-50%) translateY(20px);
    background:var(--buzz);color:var(--ink);font-weight:800;font-size:14px;padding:10px 18px;
    border-radius:999px;opacity:0;pointer-events:none;transition:opacity .2s, transform .2s;z-index:200}
  .toast.show{opacity:1;transform:translateX(-50%) translateY(0)}
  footer{margin-top:28px;font-size:12px;color:var(--muted);text-align:center;line-height:1.7}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="dot"></div>
    <h1>올라타자 지문 찾기<span>지문 일부를 입력하면 전체 문장이 자동 복사돼요</span></h1>
  </header>

  <div class="notice">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="m3 11 18-5v12L3 14v-3z"/><path d="M11.6 16.8a3 3 0 1 1-5.8-1.6"/></svg>
    <span>지문 일부만 쳐도 돼요! <b>맨 위 문장이 자동으로 복사됩니다.</b></span>
  </div>

  <div class="search">
    <input id="q" type="text" placeholder="지문 일부를 입력하세요…" autocomplete="off" autofocus>
    <button class="clear" id="clear" title="지우기">✕</button>
  </div>

  <div class="meta" id="meta"></div>
  <div class="list" id="list"></div>

  <footer>큐플레이 올라타자 지문 검색</footer>
</div>
<div class="toast" id="toast"></div>

<script>

const $ = s => document.querySelector(s);
const norm = s => s.toLowerCase().replace(/[\s\p{P}\p{S}]+/gu, "");
const esc = s => s.replace(/[.*+?^${}()|[\]\\]/g, "\\$&");
const DN = DATA.map(t => ({ t, n: norm(t) }));

function highlight(text, query){
  const tokens = query.trim().split(/\s+/).filter(Boolean);
  if(!tokens.length) return text;
  try{ return text.replace(new RegExp("(" + tokens.map(esc).join("|") + ")", "gi"), "<mark>$1</mark>"); }
  catch(e){ return text; }
}
function allCharsIn(q, text){ for(const ch of new Set(q)){ if(!text.includes(ch)) return false; } return true; }
function score(tokens, qjoined, n){
  if(!tokens.length) return 0;
  let allSub = true, first = Infinity;
  for(const t of tokens){ const idx = n.indexOf(t); if(idx === -1){ allSub = false; break; } if(idx < first) first = idx; }
  if(allSub) return Math.max(40, 100 - first);
  if(qjoined.length >= 3 && allCharsIn(qjoined, n)) return 25;
  return 0;
}

function showToast(t){ toast.textContent = t; toast.classList.add("show"); clearTimeout(toastT); toastT = setTimeout(() => toast.classList.remove("show"), 1300); }
function copyText(t){
  if(navigator.clipboard && navigator.clipboard.writeText) return navigator.clipboard.writeText(t);
  return new Promise((res, rej) => { try{ const ta = document.createElement("textarea"); ta.value = t; ta.style.position = "fixed"; ta.style.opacity = "0"; document.body.appendChild(ta); ta.select(); document.execCommand("copy"); ta.remove(); res(); }catch(e){ rej(e); } });
}
function escAttr(s){ return s.replace(/&/g,"&amp;").replace(/</g,"&lt;").replace(/>/g,"&gt;").replace(/"/g,"&quot;"); }

const CPICON = '<svg class="cp" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="9" y="9" width="13" height="13" rx="2"/><path d="M5 15H4a2 2 0 0 1-2-2V4a2 2 0 0 1 2-2h9a2 2 0 0 1 2 2v1"/></svg>';

function render(){
  const query = $("#q").value.trim();
  if(!query){ $("#meta").innerHTML = ""; $("#list").innerHTML = '<div class="empty"><b>지문을 검색해보세요</b>문장 일부만 입력하면 전체가 나와요.</div>'; return; }
  const tokens = query.split(/\s+/).map(norm).filter(Boolean);
  const qj = tokens.join("");
  let rows = DN.map(d => ({ t: d.t, s: score(tokens, qj, d.n) })).filter(d => d.s > 0);
  rows.sort((a, b) => b.s - a.s);
  const total = rows.length; rows = rows.slice(0, 30);
  $("#meta").innerHTML = "\u201c" + escAttr(query) + "\u201d 검색결과 <b>" + total + "</b>건" + (rows.length ? ' \u00b7 <span class="autonote">맨 위 지문 자동 복사됨</span>' : '');
  if(!rows.length){ $("#list").innerHTML = '<div class="empty"><b>결과가 없어요</b>다른 단어로 다시 검색해보세요.</div>'; return; }
  $("#list").innerHTML = rows.map((d, i) => '<div class="card' + (i === 0 ? ' top' : '') + '" data-copy="' + escAttr(d.t) + '">' + CPICON + highlight(d.t, query) + '</div>').join("");
  copyText(rows[0].t).catch(() => {});
}

$("#q").addEventListener("input", render);
$("#q").addEventListener("keydown", e => {
  if(e.key === "Enter"){ const f = $("#list .card"); if(f) copyText(f.dataset.copy).then(() => showToast("맨 위 지문을 복사했어요!")).catch(() => {}); }
  if(e.key === "Escape"){ $("#q").value = ""; render(); }
});
$("#list").addEventListener("click", e => { const c = e.target.closest(".card"); if(!c) return; copyText(c.dataset.copy).then(() => showToast("지문이 복사됐어요!")).catch(() => {}); });
$("#clear").addEventListener("click", () => { $("#q").value = ""; $("#q").focus(); render(); });
render();
</script>
</body>
</html>
